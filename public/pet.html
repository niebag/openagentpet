<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; script-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAgentPet</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      img,
      canvas:not([hidden]) {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      img[hidden],
      canvas {
        display: none;
      }

      body {
        -webkit-app-region: drag;
        display: grid;
        grid-template-rows: minmax(0, 1fr) 24px;
      }

      .artwork {
        min-height: 0;
      }

      #label {
        align-self: center;
        box-sizing: border-box;
        color: white;
        font: 13px system-ui;
        overflow: hidden;
        padding: 0 8px;
        text-align: center;
        text-overflow: ellipsis;
        user-select: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="artwork">
      <img alt="OpenAgentPet" />
      <canvas hidden aria-label="Reduced-motion OpenAgentPet"></canvas>
    </div>
    <div id="label"></div>
    <script src="pet.js"></script>
  </body>
</html>
