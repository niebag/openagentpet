<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAgentPet</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      img {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      img:target {
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="Idle" src="clawd-vibing.gif" alt="Idle OpenAgentPet" />
    <img id="Thinking" src="clawd-thinking.gif" alt="Thinking OpenAgentPet" />
    <img
      id="Researching"
      src="clawd-researching.gif"
      alt="Researching OpenAgentPet"
    />
    <img id="Working" src="clawd-building.gif" alt="Working OpenAgentPet" />
    <img id="Needs-input" src="clawd-idea.gif" alt="OpenAgentPet needs input" />
  </body>
</html>
